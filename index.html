<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151416"><title>BUTAK · Tu universo de cine</title><style>
:root{color-scheme:dark;--bg:#141416;--panel:#201e20;--gold:#c9a777;--muted:#aaa3a1;--wine:#672c38}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#40252c 0,transparent 43%),var(--bg);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#f3eee9}header{position:sticky;top:0;z-index:5;background:#171518ee;backdrop-filter:blur(12px);border-bottom:1px solid #55443d;display:flex;align-items:center;justify-content:space-between;padding:15px max(18px,calc((100vw - 1100px)/2))}.logo{font-family:Georgia,serif;letter-spacing:.23em;color:var(--gold);font-size:27px;font-weight:bold}.tag{color:#b8a69a;font-size:11px;letter-spacing:.13em}main{max-width:1100px;margin:auto;padding:26px 18px 70px}.hero{padding:28px 0 20px}.eyebrow{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:11px}h1{font-family:Georgia,serif;font-size:clamp(32px,6vw,58px);line-height:1.1;margin:12px 0;color:#f7eee5;font-weight:normal}p{color:var(--muted)}.search{display:flex;gap:9px;margin:22px 0 26px}.search input{flex:1;min-width:0;background:#272327;border:1px solid #6b5551;border-radius:9px;padding:15px;color:white;font:inherit}.search button,.btn{background:var(--wine);border:1px solid #a86a69;border-radius:9px;padding:12px 18px;color:white;cursor:pointer;font:inherit}.tabs{display:flex;gap:9px;overflow-x:auto;padding-bottom:12px;margin-bottom:14px}.tabs button{white-space:nowrap;border:1px solid #4a4140;background:#252124;color:#ddd0c5;padding:10px 16px;border-radius:30px;cursor:pointer}.tabs button.active{border-color:var(--gold);color:var(--gold)}.heading{font-family:Georgia,serif;font-size:25px;color:#e8d2b8;margin:24px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:21px 15px}.movie{cursor:pointer;min-width:0}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:linear-gradient(140deg,#42333a,#19191a);border-radius:8px;border:1px solid #4c3b3c;display:block}.movie h3{font-size:14px;margin:9px 0 5px;line-height:1.35;font-weight:600}.meta{font-size:12px;color:#c3a77d}.note{padding:15px;border:1px solid #53423f;border-radius:9px;background:#221e20;color:#d9c6ba}.overlay{position:fixed;inset:0;z-index:10;background:#080708db;display:none;align-items:center;justify-content:center;padding:14px}.overlay.show{display:flex}.dialog{position:relative;background:#242023;border:1px solid #6a514a;border-radius:14px;max-width:690px;width:100%;max-height:92vh;overflow:auto;padding:22px}.close{position:absolute;right:12px;top:10px;border:0;background:#47363a;color:white;border-radius:50%;width:36px;height:36px;font-size:22px;cursor:pointer}.details{display:grid;grid-template-columns:140px 1fr;gap:20px;margin-top:22px}.details img{width:100%;border-radius:7px}.details h2{font-family:Georgia,serif;font-size:28px;font-weight:normal;margin:0}.details p{line-height:1.6}.footer{text-align:center;color:#8f8580;font-size:12px;margin-top:45px}a{color:var(--gold)}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.details{grid-template-columns:100px 1fr;gap:13px}.details h2{font-size:22px}.dialog{padding:15px}}
</style></head><body><header><div><div class="logo">BUTAK</div><div class="tag">EL CINE ES TUYO</div></div><div style="color:#c5a881;font-size:12px">TU UNIVERSO CINÉFILO</div></header><main><section class="hero"><div class="eyebrow">Descubre · Valora · Recuerda</div><h1>Historias que<br>se quedan contigo.</h1><p>Explora películas, descubre nuevas historias y crea tu propia colección.</p></section><form class="search" id="search"><input id="q" placeholder="Busca una película…" aria-label="Buscar películas" required><button>Buscar</button></form><nav class="tabs" aria-label="Secciones"><button class="active" data-view="popular">Populares</button><button data-view="top_rated">Mejor valoradas</button><button data-view="now_playing">En cartelera</button><button data-view="saved">Mi lista</button></nav><h2 class="heading" id="heading">Películas populares</h2><div id="status" role="status"></div><section id="grid" class="grid"></section><div class="footer">Datos cinematográficos proporcionados por TMDB · BUTAK no está avalada por TMDB.</div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Ficha de película"><div class="dialog"><button class="close" id="close" aria-label="Cerrar">×</button><div id="detail"></div></div></div><script>
const API='https://butak-api.elmataderodemorkay.workers.dev';const IMG='https://image.tmdb.org/t/p/w500';const $=s=>document.querySelector(s);let current='popular',movies=[];const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const saved=()=>{try{return JSON.parse(localStorage.getItem('butak-saved')||'[]')}catch{return []}};function store(items){localStorage.setItem('butak-saved',JSON.stringify(items))}function render(items){movies=items;$('#grid').innerHTML=items.map(m=>`<article class="movie" tabindex="0" role="button" data-id="${Number(m.id)}"><img class="poster" loading="lazy" alt="Cartel de ${escapeHTML(m.title)}" src="${m.poster_path?IMG+encodeURIComponent(m.poster_path):''}"><h3>${escapeHTML(m.title)}</h3><div class="meta">${escapeHTML((m.release_date||'').slice(0,4))} · ★ ${Number(m.vote_average||0).toFixed(1)}</div></article>`).join('');$('#status').innerHTML=items.length?'':'<div class="note">No hay películas para mostrar.</div>'}async function get(path){let r=await fetch(API+path);if(!r.ok)throw Error('Error '+r.status);return r.json()}async function load(view='popular',query=''){current=view;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#heading').textContent=query?'Resultados de búsqueda':({popular:'Películas populares',top_rated:'Mejor valoradas',now_playing:'En cartelera',saved:'Mi lista'}[view]);$('#status').innerHTML='<div class="note">Cargando películas…</div>';$('#grid').innerHTML='';try{if(view==='saved'){render(saved());return}const path=query?'/search/movie?query='+encodeURIComponent(query):'/movie/'+view+'?language=es-ES';let data=await get(path+(path.includes('?')?'&':'?')+'language=es-ES');render(data.results||[])}catch(e){$('#status').innerHTML='<div class="note">No se han podido cargar las películas. Comprueba la conexión e inténtalo de nuevo.</div>'}}async function openMovie(id){$('#overlay').classList.add('show');$('#detail').innerHTML='<p>Cargando ficha…</p>';try{let m=await get('/movie/'+id+'?language=es-ES');let isSaved=saved().some(x=>x.id===m.id);$('#detail').innerHTML=`<div class="details"><img alt="Cartel de ${escapeHTML(m.title)}" src="${m.poster_path?IMG+encodeURIComponent(m.poster_path):''}"><div><div class="eyebrow">FICHA CINEMATOGRÁFICA</div><h2>${escapeHTML(m.title)}</h2><p class="meta">${escapeHTML((m.release_date||'').slice(0,4))} · ★ ${Number(m.vote_average||0).toFixed(1)} / 10 · ${Number(m.runtime||0)} min</p><p>${escapeHTML(m.overview||'Sin sinopsis disponible.')}</p><button class="btn" id="save">${isSaved?'Quitar de mi lista':'＋ Guardar en mi lista'}</button></div></div>`;$('#save').onclick=()=>{let arr=saved();arr=arr.some(x=>x.id===m.id)?arr.filter(x=>x.id!==m.id):[...arr,{id:m.id,title:m.title,poster_path:m.poster_path,release_date:m.release_date,vote_average:m.vote_average}];store(arr);$('#save').textContent=arr.some(x=>x.id===m.id)?'Quitar de mi lista':'＋ Guardar en mi lista';if(current==='saved')render(arr)}}catch{$('#detail').innerHTML='<p>No se ha podido cargar esta ficha.</p>'}}$('#grid').addEventListener('click',e=>{let a=e.target.closest('[data-id]');if(a)openMovie(a.dataset.id)});$('#grid').addEventListener('keydown',e=>{if(e.key==='Enter'){let a=e.target.closest('[data-id]');if(a)openMovie(a.dataset.id)}});$('#close').onclick=()=>$('#overlay').classList.remove('show');$('#overlay').onclick=e=>{if(e.target.id==='overlay')$('#close').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#close').click()});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ $('#q').value='';load(b.dataset.view)});$('#search').onsubmit=e=>{e.preventDefault();load('search',$('#q').value.trim())};load();
</script></body></html>
