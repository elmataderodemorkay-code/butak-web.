<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171416"><meta name="description" content="BUTAK, tu universo cinéfilo: descubre, puntúa, juega y guarda tus películas."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>BUTAK · Tu universo cinéfilo</title><style>
:root{--bg:#121114;--panel:#211c20;--panel2:#30252b;--gold:#d9b782;--wine:#843e51;--muted:#aaa0a2;--line:#514048}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6eee9;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--gold)}header{position:sticky;top:0;z-index:20;background:#171317f5;border-bottom:1px solid #4c393d;backdrop-filter:blur(15px)}.head{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:13px 17px}.brand{font:700 29px Georgia,serif;letter-spacing:7px;color:var(--gold)}.tag{font-size:10px;letter-spacing:2px;color:#c4b3a8}.topnav{display:flex;gap:5px;overflow:auto;max-width:1150px;margin:auto;padding:0 10px 8px}.topnav button,.chip{background:transparent;color:#cfc1bf;border:1px solid transparent;border-radius:25px;padding:10px 13px;white-space:nowrap}.topnav button.active,.chip.active{color:var(--gold);border-color:var(--gold);background:#32262b}main{max-width:1150px;margin:auto;min-height:80vh;padding:0 16px 75px}.hero{margin:16px 0 26px;border:1px solid #60464b;border-radius:22px;min-height:260px;background:linear-gradient(90deg,#171316 3%,#2d1a24d9 64%,#201920),radial-gradient(circle at 80% 30%,#7c3b4d,transparent 60%);padding:30px 22px;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:3px;text-transform:uppercase}.hero h1{font:normal clamp(35px,7vw,64px) Georgia,serif;margin:12px 0;max-width:600px;line-height:1.1}.hero p{color:#c9bcb9;max-width:500px;line-height:1.6}.search{display:flex;gap:8px;margin:18px 0}.search input,.field{width:100%;background:#292228;border:1px solid #695159;color:#fff;border-radius:12px;padding:13px;min-width:0}.primary{background:var(--wine);color:#fff;border:1px solid #b36c7b;border-radius:12px;padding:12px 16px}.secondary{background:#30262b;color:#f5e8dd;border:1px solid #655159;border-radius:12px;padding:11px 14px}.controls{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}h2{font:normal 29px Georgia,serif;margin:24px 0 16px;color:#f5e9df}.section-note{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(min-width:680px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{padding:45px}}@media(min-width:1000px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}.movie{border:1px solid #3e3035;background:#211c20;border-radius:14px;overflow:hidden;text-align:left;color:#fff;padding:0;transition:transform .2s}.movie:active{transform:scale(.98)}.poster{aspect-ratio:2/3;width:100%;object-fit:cover;display:block;background:linear-gradient(135deg,#392c35,#17171a)}.movieinfo{padding:10px}.movieinfo strong{display:block;font-size:14px;line-height:1.35;min-height:37px}.small{font-size:12px;color:#c1ada5;margin-top:7px}.gold{color:var(--gold)}.empty{padding:25px;border:1px dashed #6a4e55;border-radius:16px;color:#c4b6b2;line-height:1.6}.overlay{position:fixed;inset:0;background:#070609df;z-index:30;overflow:auto;padding:20px 12px}.detail{max-width:800px;margin:12px auto 40px;background:#231c21;border:1px solid #685058;border-radius:19px;overflow:hidden}.backdrop{height:230px;background-size:cover;background-position:center;position:relative}.backdrop:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#231c21,transparent)}.detailbody{padding:0 20px 25px;position:relative}.detailhead{display:flex;gap:16px;align-items:end;margin-top:-85px}.detailhead img{width:120px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;border:2px solid #7a5e5d;background:#34252d;z-index:1}.detailhead>div{z-index:1}.detail h2{margin:5px 0;font-size:30px}.detail p{line-height:1.65;color:#d2c6c2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.close{position:absolute;right:16px;top:14px;z-index:2;border:1px solid #8d6870;border-radius:50%;width:42px;height:42px;background:#24191de8;color:white;font-size:24px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:#282027;padding:20px;border:1px solid #55404a;border-radius:14px}.stat b{font:30px Georgia,serif;color:var(--gold)}.stat span{display:block;color:#c7b9b3;margin-top:8px}.cast{display:flex;gap:12px;overflow:auto}.person{width:110px;flex:none;font-size:12px;color:#cfc1bc}.person img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px}.quiz{background:#241d23;border:1px solid #5a414b;border-radius:18px;padding:20px}.option{display:block;width:100%;margin:10px 0;text-align:left;background:#342830;color:white;border:1px solid #69505a;border-radius:12px;padding:13px}.option:disabled{opacity:.7}.label{display:block;color:var(--gold);margin:14px 0 6px}.review{background:#2c2329;padding:15px;border-radius:12px;margin:12px 0}.review p{white-space:pre-wrap}.footer{padding:30px;text-align:center;color:#a39391;font-size:12px;border-top:1px solid #3b3033}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#d3b181;color:#1b1516;border-radius:20px;padding:11px 18px;z-index:60;display:none;max-width:90vw;text-align:center}select{background:#31262b;color:white;border:1px solid #67515a;border-radius:10px;padding:10px}textarea{min-height:110px;resize:vertical}.pill{display:inline-block;border:1px solid #665058;padding:5px 9px;border-radius:15px;margin:3px;font-size:12px;color:#c9b6b0}</style></head><body><header><div class="head"><div><div class="brand">BUTAK</div><div class="tag">EL CINE ES TUYO</div></div><div class="tag">TU UNIVERSO CINÉFILO</div></div><nav class="topnav" id="nav"><button data-tab="inicio" class="active">Inicio</button><button data-tab="descubrir">Descubrir</button><button data-tab="biblioteca">Mi biblioteca</button><button data-tab="tops">Mis tops</button><button data-tab="juegos">Juegos</button><button data-tab="perfil">Mi perfil</button></nav></header><main id="app"></main><div id="modal"></div><div id="toast"></div><footer class="footer">BUTAK · Datos de películas proporcionados por TMDB. Este producto no está respaldado ni certificado por TMDB.<br>Tu biblioteca y tus críticas se guardan en este dispositivo.</footer><script>
const API='https://butak-api.elmataderodemorkay.workers.dev',IMG='https://image.tmdb.org/t/p/',KEY='butak_v2';let tab='inicio',category='popular',page=1,query='',movies=[],busy=false,detail=null,quiz=null;let store;try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{store={}};store.entries ||= {};store.tops ||= [];store.name ||= 'Cinéfilo';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(store)),poster=(p,size='w342')=>p?IMG+size+p:'',year=m=>(m.release_date||'').slice(0,4)||'—',rating=m=>Number(m.vote_average||0).toFixed(1),toast=t=>{let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2800)};
async function get(path){const res=await fetch(API+path);if(!res.ok)throw Error('No se pudo consultar el catálogo ('+res.status+')');return res.json()};const params=o=>new URLSearchParams(o).toString();function setTab(t){tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));function cards(items){return '<div class="grid">'+items.map(m=>`<button class="movie" data-movie="${m.id}"><img class="poster" loading="lazy" src="${poster(m.poster_path)}" alt="" onerror="this.style.opacity=.2"><div class="movieinfo"><strong>${esc(m.title)}</strong><div class="small">${esc(year(m))} · <span class="gold">★ ${rating(m)}</span></div></div></button>`).join('')+'</div>'}function bindCards(){document.querySelectorAll('[data-movie]').forEach(b=>b.onclick=()=>openMovie(b.dataset.movie))}function render(){let el=$('#app');if(tab==='inicio'||tab==='descubrir'){el.innerHTML=`${tab==='inicio'?'<section class="hero"><div class="eyebrow">DESCUBRE · VALORA · RECUERDA</div><h1>Historias que se quedan contigo.</h1><p>Un lugar para tus películas, tus recuerdos y tus próximas obsesiones cinematográficas.</p></section>':''}<form class="search" id="search"><input id="searchq" placeholder="Busca una película…" value="${esc(query)}" aria-label="Buscar película"><button class="primary">Buscar</button></form><div class="controls">${[['popular','Populares'],['top_rated','Mejor valoradas'],['now_playing','En cartelera'],['upcoming','Próximamente']].map(([v,l])=>`<button class="chip ${category===v&&!query?'active':''}" data-cat="${v}">${l}</button>`).join('')}</div><h2 id="resultsTitle">${query?'Resultados de «'+esc(query)+'»':({popular:'Películas populares',top_rated:'Las mejor valoradas',now_playing:'En cartelera',upcoming:'Próximos estrenos'}[category])}</h2><div id="results"><p class="section-note">Cargando películas…</p></div><div style="text-align:center;margin:25px"><button class="secondary" id="more" style="display:none">Ver más películas</button></div>`;$('#search').onsubmit=e=>{e.preventDefault();query=$('#searchq').value.trim();page=1;load()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;query='';page=1;render()});$('#more').onclick=()=>{page++;load(true)};load();return}if(tab==='biblioteca'){let all=Object.values(store.entries).filter(x=>x.status||x.favorite||x.score),filter=window.libFilter||'all';let selected=all.filter(x=>filter==='all'||(filter==='favorite'?x.favorite:x.status===filter));el.innerHTML=`<h2>Mi biblioteca</h2><p class="section-note">Tu colección personal, guardada en este navegador.</p><div class="controls">${[['all','Todas'],['watched','Vistas'],['watchlist','Pendientes'],['favorite','Favoritas']].map(([k,v])=>`<button class="chip ${filter===k?'active':''}" data-filter="${k}">${v}</button>`).join('')}</div>${selected.length?cards(selected.map(x=>x.movie)):'<div class="empty">Todavía no tienes películas aquí. Abre una ficha y marca la película como vista, pendiente o favorita.</div>'}`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{window.libFilter=b.dataset.filter;render()});bindCards();return}if(tab==='tops'){let all=Object.values(store.entries).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);el.innerHTML=`<h2>Mis tops</h2><p class="section-note">Tu ranking personal se ordena automáticamente según las notas que das a las películas.</p>${all.length?cards(all.map(x=>x.movie)):'<div class="empty">Puntúa películas en sus fichas para crear tu ranking personal.</div>'}`;bindCards();return}if(tab==='perfil'){let all=Object.values(store.entries),watched=all.filter(x=>x.status==='watched'),scored=all.filter(x=>x.score>0),avg=scored.length?(scored.reduce((s,x)=>s+x.score,0)/scored.length).toFixed(1):'—';el.innerHTML=`<h2>Mi rincón cinéfilo</h2><label class="label">Tu nombre de cinéfilo</label><div class="search"><input class="field" id="username" maxlength="35" value="${esc(store.name)}"><button class="primary" id="savename">Guardar</button></div><div class="stats"><div class="stat"><b>${watched.length}</b><span>Películas vistas</span></div><div class="stat"><b>${all.filter(x=>x.status==='watchlist').length}</b><span>Pendientes</span></div><div class="stat"><b>${all.filter(x=>x.favorite).length}</b><span>Favoritas</span></div><div class="stat"><b>${avg}</b><span>Tu nota media</span></div></div><h2>Mis datos</h2><p class="section-note">Exporta tu biblioteca para conservar una copia o trasladarla a otro dispositivo. No existe todavía sincronización entre amigos.</p><div class="actions"><button class="secondary" id="export">Exportar mis datos</button><label class="secondary" style="cursor:pointer">Importar copia<input type="file" id="import" accept="application/json" hidden></label></div><h2>Próximamente</h2><div class="empty">Perfiles públicos, amistades, críticas compartidas, recomendaciones sociales y alma gemela cinéfila. Estas funciones necesitarán cuentas y una base de datos.</div>`;$('#savename').onclick=()=>{store.name=$('#username').value.trim()||'Cinéfilo';save();toast('Nombre guardado')};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='butak-mi-biblioteca.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.entries||typeof d.entries!=='object')throw Error();if(!confirm('¿Sustituir tu biblioteca actual por esta copia?'))return;store=d;store.entries ||= {};save();render();toast('Copia importada')}catch{toast('Archivo no válido')}};return}if(tab==='juegos'){el.innerHTML=`<h2>La sala de juegos</h2><p class="section-note">¿Cuánto sabes de cine? Responde preguntas con películas reales del catálogo.</p><div class="quiz" id="quizarea"><button class="primary" id="startquiz">Empezar reto de carteles</button><p class="section-note">Adivina la película a partir de su cartel. 5 preguntas por partida.</p></div>`;$('#startquiz').onclick=startQuiz;return}}
async function load(append=false){if(busy)return;busy=true;try{let path=query?'/search/movie?'+params({query,page,language:'es-ES',include_adult:false}):'/movie/'+category+'?'+params({page,language:'es-ES',region:'ES'});let d=await get(path);movies=append?[...movies,...(d.results||[])]:d.results||[];$('#results').innerHTML=movies.length?cards(movies):'<div class="empty">No encontramos películas con esa búsqueda.</div>';$('#resultsTitle').textContent=query?'Resultados de «'+query+'»':({popular:'Películas populares',top_rated:'Las mejor valoradas',now_playing:'En cartelera',upcoming:'Próximos estrenos'}[category]);$('#more').style.display=page<(d.total_pages||1)?'inline-block':'none';bindCards()}catch(e){$('#results').innerHTML='<div class="empty">'+esc(e.message)+'. Comprueba tu conexión e inténtalo de nuevo.</div>'}finally{busy=false}}
async function openMovie(id){$('#modal').innerHTML='<div class="overlay"><div class="detail" style="padding:30px">Cargando ficha…</div></div>';try{let m=await get('/movie/'+id+'?'+params({language:'es-ES',append_to_response:'credits,videos,recommendations'}));detail=m;drawDetail()}catch(e){$('#modal').innerHTML='<div class="overlay"><div class="detail" style="padding:25px"><button class="secondary" onclick="closeMovie()">Cerrar</button><p>'+esc(e.message)+'</p></div></div>'}}function closeMovie(){$('#modal').innerHTML='';detail=null}function drawDetail(){let m=detail,x=store.entries[m.id]||{},cast=m.credits?.cast?.slice(0,10)||[],trailer=(m.videos?.results||[]).find(v=>v.site==='YouTube'&&v.type==='Trailer');$('#modal').innerHTML=`<div class="overlay" id="overlay"><article class="detail"><div class="backdrop" style="background-image:linear-gradient(0deg,#231c21,transparent 80%),url('${poster(m.backdrop_path,'w1280')}')"><button class="close" id="close" aria-label="Cerrar">×</button></div><div class="detailbody"><div class="detailhead"><img src="${poster(m.poster_path,'w500')}" alt="Cartel de ${esc(m.title)}"><div><div class="eyebrow">FICHA CINEMATOGRÁFICA</div><h2>${esc(m.title)}</h2><div class="small">${year(m)} · ★ ${rating(m)} TMDB · ${m.runtime||'—'} min</div></div></div><p>${esc(m.tagline||'')}</p><div>${(m.genres||[]).map(g=>`<span class="pill">${esc(g.name)}</span>`).join('')}</div><h2>La historia</h2><p>${esc(m.overview||'Sin sinopsis disponible.')}</p><div class="actions"><button class="secondary" id="watched">${x.status==='watched'?'✓ Vista':'Marcar vista'}</button><button class="secondary" id="watchlist">${x.status==='watchlist'?'✓ Pendiente':'Ver más tarde'}</button><button class="secondary" id="favorite">${x.favorite?'♥ Favorita':'♡ Favorita'}</button></div><label class="label">Mi puntuación</label><select id="score"><option value="0">Sin puntuar</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${x.score===i+1?'selected':''}>${i+1} / 10</option>`).join('')}</select><label class="label">Mi crítica personal</label><textarea class="field" id="review" placeholder="¿Qué te ha parecido esta película?">${esc(x.review||'')}</textarea><label class="label">Privacidad de la crítica (para futuras cuentas)</label><select id="privacy"><option value="private" ${x.privacy==='private'?'selected':''}>Privada</option><option value="friends" ${x.privacy==='friends'?'selected':''}>Solo amigos (pendiente de activar)</option><option value="public" ${x.privacy==='public'?'selected':''}>Pública (pendiente de activar)</option></select><div class="actions"><button class="primary" id="savereview">Guardar mi valoración</button>${trailer?`<a class="secondary" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${encodeURIComponent(trailer.key)}">Ver tráiler</a>`:''}</div>${cast.length?`<h2>Reparto</h2><div class="cast">${cast.map(p=>`<div class="person"><img loading="lazy" src="${poster(p.profile_path,'w185')}" alt=""><b>${esc(p.name)}</b><div>${esc(p.character)}</div></div>`).join('')}</div>`:''}${m.recommendations?.results?.length?`<h2>Te puede gustar</h2>${cards(m.recommendations.results.slice(0,8))}`:''}</div></article></div>`;$('#close').onclick=closeMovie;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeMovie()};function update(change){store.entries[m.id]={...x,...(store.entries[m.id]||{}),movie:{id:m.id,title:m.title,poster_path:m.poster_path,release_date:m.release_date,vote_average:m.vote_average},...change};save();drawDetail();toast('Guardado en tu biblioteca')}$('#watched').onclick=()=>update({status:x.status==='watched'?'':'watched'});$('#watchlist').onclick=()=>update({status:x.status==='watchlist'?'':'watchlist'});$('#favorite').onclick=()=>update({favorite:!x.favorite});$('#savereview').onclick=()=>{update({score:Number($('#score').value),review:$('#review').value,privacy:$('#privacy').value});if($('#privacy').value!=='private')toast('Guardada solo en este dispositivo; aún no se comparte')};document.querySelectorAll('#modal [data-movie]').forEach(b=>b.onclick=()=>openMovie(b.dataset.movie))}
async function startQuiz(){let box=$('#quizarea');box.innerHTML='<p>Cargando preguntas…</p>';try{let d=await get('/movie/popular?'+params({language:'es-ES',page:Math.ceil(Math.random()*4)+1}));let pool=(d.results||[]).filter(x=>x.poster_path&&x.title);if(pool.length<8)throw Error();quiz={pool,round:0,score:0};nextQuestion()}catch{box.innerHTML='<div class="empty">No se pudieron cargar las preguntas. <button class="secondary" id="retry">Reintentar</button></div>';$('#retry').onclick=startQuiz}}function nextQuestion(){let b=$('#quizarea');if(quiz.round>=5){b.innerHTML=`<h2>Fin de la partida</h2><p>Has acertado <strong class="gold">${quiz.score} de 5</strong> carteles.</p><button class="primary" id="again">Volver a jugar</button>`;$('#again').onclick=startQuiz;return}let correct=quiz.pool[quiz.round],options=[correct,...quiz.pool.filter(x=>x.id!==correct.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);b.innerHTML=`<div class="eyebrow">Pregunta ${quiz.round+1} de 5</div><h2>¿De qué película es este cartel?</h2><img src="${poster(correct.poster_path,'w342')}" style="width:min(220px,75%);border-radius:12px;display:block;margin:20px auto" alt="Cartel de la pregunta">${options.map(o=>`<button class="option" data-answer="${o.id}">${esc(o.title)}</button>`).join('')}<div id="feedback"></div>`;document.querySelectorAll('[data-answer]').forEach(x=>x.onclick=()=>{let ok=Number(x.dataset.answer)===correct.id;if(ok)quiz.score++;document.querySelectorAll('[data-answer]').forEach(y=>y.disabled=true);$('#feedback').innerHTML=`<p class="gold">${ok?'¡Correcto!':'Era '+esc(correct.title)}</p><button class="primary" id="next">Siguiente</button>`;quiz.round++;$('#next').onclick=nextQuestion})}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
